<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laporan Harian Guru Tahfizh</title><style>body{font-family:Inter,Arial;background:#f4f8fa;color:#17324d;margin:0}.top{background:#173f63;color:#fff;padding:22px}.wrap{max-width:1150px;margin:auto;padding:18px}.bar,.cards{display:flex;gap:10px;flex-wrap:wrap}.card{background:#fff;border:1px solid #dce8ee;border-radius:14px;padding:14px}.cards .card{min-width:150px}.num{font-size:25px;font-weight:800}.muted{font-size:12px;color:#718493}input,button{padding:10px;border:1px solid #ccdbe3;border-radius:9px}button{background:#173f63;color:#fff;font-weight:700;cursor:pointer}table{width:100%;border-collapse:collapse;background:#fff;margin-top:14px}th,td{padding:10px;border-bottom:1px solid #e6eef2;text-align:left;font-size:12px}th{background:#eef5f7}.ok{font-weight:800;color:#14735c}.no{font-weight:800;color:#b44747}.back{color:#fff}</style></head><body><div class="top"><a class="back" href="./">← CQlass</a><h2>Laporan Harian Guru Tahfizh</h2><div>Monitoring aktivitas harian seluruh guru halaqah untuk Kabid Qur'an.</div></div><div class="wrap"><div class="bar"><input id="date" type="date"><button id="load">Tampilkan</button></div><div id="cards" class="cards" style="margin-top:14px"></div><div id="meta" class="muted" style="margin-top:10px"></div><table><thead><tr><th>Guru</th><th>Siswa Halaqah</th><th>Status</th><th>Aktivitas</th><th>Badal Masuk</th><th>Digantikan</th><th>Rincian</th></tr></thead><tbody id="body"></tbody></table></div><script>
const API='https://lmglkxzemtvxcgktiord.supabase.co/functions/v1/tahfizh-monthly-status',KEY='sb_publishable_3HyNVUYXakILMKo2SK-DJw_ka7-Yx93',TOKEN=localStorage.getItem('cqlass_session_token')||'',E=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
E('date').value=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta'}).format(new Date());
async function load(){E('meta').textContent='Memuat...';const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY,'x-session-token':TOKEN},body:JSON.stringify({action:'daily',work_date:E('date').value})});const j=await r.json();if(!r.ok||j.success===false){E('meta').textContent=j.error||'Gagal memuat';return}const s=j.summary;E('cards').innerHTML='<div class="card"><div class="num">'+s.teachers+'</div><div class="muted">Guru Halaqah</div></div><div class="card"><div class="num">'+s.sudah_lapor+'</div><div class="muted">Sudah Lapor</div></div><div class="card"><div class="num">'+s.belum_lapor+'</div><div class="muted">Belum Lapor</div></div><div class="card"><div class="num">'+s.activities+'</div><div class="muted">Aktivitas Tercatat</div></div>';E('meta').textContent='Tanggal '+j.work_date+' · '+j.academic_year+' · Semester '+j.semester_no;E('body').innerHTML=(j.teachers||[]).map(x=>'<tr><td><b>'+esc(x.teacher_name)+'</b></td><td>'+x.student_count+'</td><td class="'+(x.status==='sudah_lapor'?'ok':'no')+'">'+(x.status==='sudah_lapor'?'Sudah lapor':'Belum lapor')+'</td><td>'+x.activity_count+'</td><td>'+x.badal_menggantikan+'</td><td>'+x.badal_digantikan+'</td><td>'+esc((x.activities||[]).map(a=>(a.start_time||'')+' '+a.activity).join(' · ')||'—')+'</td></tr>').join('')}</script><script>E('load').onclick=load;load();</script></body></html>

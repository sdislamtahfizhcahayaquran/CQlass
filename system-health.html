<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control Center — CQlass</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f8f8;color:#17343a}.top{background:#1f3440;color:#fff;padding:17px 22px;display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:22px}.top p{margin:4px 0 0;font-size:12px;opacity:.8}.back{color:#fff;text-decoration:none;border:1px solid #ffffff55;padding:9px 12px;border-radius:8px;font-weight:800;font-size:12px}.wrap{max-width:1300px;margin:auto;padding:18px}.status{background:#fff;border:1px solid #dfe9e7;border-radius:11px;padding:11px;margin-bottom:13px;font-size:12px}.err{background:#fff0f0;color:#9d2a2a}.checks,.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#fff;border:1px solid #dfe9e7;border-radius:13px;padding:13px}.card b{display:block;font-size:20px}.card span{font-size:10.5px;color:#71878c}.check{display:flex;gap:9px;align-items:flex-start}.dot{width:10px;height:10px;border-radius:50%;margin-top:4px;background:#aaa}.GREEN .dot{background:#16835f}.YELLOW .dot{background:#daa520}.RED .dot{background:#c54848}.check strong{font-size:12px}.check small{display:block;color:#71878c;margin-top:3px}.section{margin:20px 0 8px;font-size:14px}.fresh{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}.fresh td,.fresh th{padding:9px;border-bottom:1px solid #e7eeec;font-size:11px;text-align:left}.fresh th{background:#eef5f4}@media(max-width:900px){.checks,.counts{grid-template-columns:1fr 1fr}}@media(max-width:520px){.checks,.counts{grid-template-columns:1fr}}</style></head><body><div class="top"><div><h1>CQlass Control Center</h1><p>Kesehatan data dan kelengkapan integrasi Supabase.</p></div><a class="back" href="./">← CQlass</a></div><div class="wrap"><div id="status" class="status">Memeriksa sistem...</div><div class="section">Status Utama</div><div id="checks" class="checks"></div><div class="section">Jumlah Data</div><div id="counts" class="counts"></div><div class="section">Data Terakhir Diperbarui</div><table class="fresh"><thead><tr><th>Modul</th><th>Update Terakhir</th></tr></thead><tbody id="fresh"></tbody></table></div><script>const URL='https://lmglkxzemtvxcgktiord.supabase.co/functions/v1/system-health',KEY='sb_publishable_3HyNVUYXakILMKo2SK-DJw_ka7-Yx93',TOKEN=localStorage.getItem('cqlass_session_token')||'';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(){if(!TOKEN)throw Error('Login CQlass diperlukan.');const r=await fetch(URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY,'x-session-token':TOKEN},body:'{}'}),j=await r.json().catch(()=>({}));if(r.status===403)throw Error('Control Center hanya untuk Admin.');if(!r.ok||!j.success)throw Error(j.error||'Gagal membaca kesehatan sistem.');return j}function label(k){return k.replace(/_/g,' ').replace(/\b\w/g,x=>x.toUpperCase())}async function load(){try{const d=await api();$('status').textContent='Pemeriksaan selesai · '+new Date(d.generated_at).toLocaleString('id-ID');$('checks').innerHTML=d.checks.map(x=>`<div class="card check ${x.status}"><i class="dot"></i><div><strong>${esc(x.label)}</strong><small>${esc(x.value)} · ${x.status}</small></div></div>`).join('');$('counts').innerHTML=Object.entries(d.counts).map(([k,v])=>`<div class="card"><b>${Number(v).toLocaleString('id-ID')}</b><span>${esc(label(k))}</span></div>`).join('');$('fresh').innerHTML=Object.entries(d.freshness).map(([k,v])=>`<tr><td>${esc(label(k))}</td><td>${v?new Date(v).toLocaleString('id-ID'):'Belum ada data'}</td></tr>`).join('')}catch(e){$('status').className='status err';$('status').textContent=e.message}}load();</script></body></html>

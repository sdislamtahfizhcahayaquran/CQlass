<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CQlass Live Rapor</title><link rel="stylesheet" href="styles.css"></head><body><header><div><b>CQlass Live Rapor</b><small id="period">Periode aktif mengikuti CQlass</small></div><button id="refresh">Refresh</button></header><main><section class="hero"><h1>Monitoring Rapor</h1><p>Read-only. Tidak mengubah nilai, role, absensi, maupun data CQlass.</p></section><section class="cards"><button class="card active" data-view="rekapan"><strong>REKAPAN</strong><span>Audit pengerjaan rapor</span></button><button class="card" data-view="rapor"><strong>RAPOR</strong><span>Preview hasil rapor</span></button></section><section id="rekapan" class="panel"><div class="toolbar"><input id="search" placeholder="Cari kelas / wali kelas"><select id="status"><option value="">Semua status</option><option value="selesai">Selesai</option><option value="sebagian">Belum lengkap</option><option value="belum">Belum mulai</option></select></div><div id="summary" class="summary"></div><div class="table-wrap"><table><thead><tr><th>Kelas</th><th>Wali Kelas</th><th>Progress</th><th>Belum Lengkap</th><th></th></tr></thead><tbody id="classRows"><tr><td colspan="5" class="empty">Viewer belum dihubungkan ke endpoint read-only.</td></tr></tbody></table></div></section><section id="rapor" class="panel hidden"><div class="toolbar"><select id="reportClass"><option>Pilih kelas</option></select><button id="previewClass" disabled>Preview 1 Kelas</button></div><div id="reportArea" class="report-empty">Pilih kelas untuk melihat rapor per siswa atau satu kelas penuh.</div></section></main><dialog id="detailDialog"><div class="dialog-head"><div><b id="detailTitle">Detail Kelas</b><small id="detailSub"></small></div><button onclick="detailDialog.close()">×</button></div><div id="detailBody"></div></dialog><script src="app.js"></script></body></html>

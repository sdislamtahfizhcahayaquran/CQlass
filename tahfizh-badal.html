<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Badal Tahfizh</title><style>
body{font-family:Inter,Arial;background:#f4f8fa;color:#17324d;margin:0}.top{background:#173f63;color:#fff;padding:22px}.wrap{max-width:1150px;margin:auto;padding:18px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:11px;font-weight:800;color:#536d7b}input,select,button{padding:9px;border:1px solid #ccdbe3;border-radius:9px;background:#fff}.searchpick{position:relative;min-width:220px}.searchpick input{width:100%}.picklist{display:none;position:absolute;z-index:50;top:calc(100% + 4px);left:0;right:0;max-height:230px;overflow:auto;background:#fff;border:1px solid #ccdbe3;border-radius:10px;box-shadow:0 12px 28px rgba(23,63,99,.14);padding:5px}.picklist.open{display:block}.pickitem{padding:9px;border-radius:7px;font-size:12px;cursor:pointer}.pickitem:hover{background:#eef5f7}.pickempty{padding:9px;color:#718493;font-size:12px}button{background:#173f63;color:#fff;font-weight:700;cursor:pointer}.btn-save{margin-top:14px;min-width:170px}.btn-save:disabled{opacity:.55;cursor:not-allowed}table{width:100%;border-collapse:collapse;background:#fff;margin-top:14px}th,td{padding:10px;border-bottom:1px solid #e6eef2;text-align:left;font-size:12px}th{background:#eef5f7}.back{color:#fff}.muted{color:#718493;font-size:12px}.check{text-align:center;width:52px}.check input{width:17px;height:17px;accent-color:#173f63}.active{font-weight:800;color:#087b75}.empty{text-align:center;color:#718493;padding:24px}.reason{min-width:220px}.replacement{min-width:210px}
.namepick{min-width:240px}.namepick input{box-sizing:border-box;width:100%;margin-bottom:6px}.name-list{height:132px;overflow:auto;border:1px solid #dbe6eb;border-radius:10px;background:#fbfdfe;padding:5px}.name-item{display:block;width:100%;box-sizing:border-box;padding:8px 9px;border:0;background:transparent;color:#17324d;text-align:left;font-size:12px;font-weight:500;border-radius:7px;cursor:pointer}.name-item:hover{background:#eef5f7}.name-item.selected{background:#173f63;color:#fff}.toolbar{background:#fff;border:1px solid #e0e9ee;border-radius:14px;padding:14px}.tablebox{overflow-x:auto;border:1px solid #e0e9ee;border-radius:14px;margin-top:14px;background:#fff}.tablebox table{margin-top:0;min-width:900px}@media(max-width:760px){.wrap{padding:12px}.bar{display:grid;grid-template-columns:1fr}.field,.namepick{width:100%;min-width:0}.btn-save{width:100%}.top{padding:16px 18px}}.field,.combo{width:100%;min-width:0}.btn-save{width:100%}.top{padding:16px 18px}}
</style></head><body><div class="top"><a class="back" href="./">← CQlass</a><h2>Badal Tahfizh</h2><div>Pilih guru, centang jam yang dibadal, tentukan pengganti dan alasan.</div></div><div class="wrap">
<div class="toolbar"><div class="bar"><div class="field"><label>Tanggal</label><input id="date" type="date"></div><div class="field"><label>Guru yang dibadal</label><div class="namepick"><input id="teacherSearch" autocomplete="off" placeholder="Cari nama guru..."><input id="teacher" type="hidden"><div id="teacherList" class="name-list"></div></div></div><button id="load">Muat Jam</button><div class="field"><label>Pengganti Default</label><div class="namepick"><input id="defaultSubSearch" autocomplete="off" placeholder="Cari guru pengganti..."><input id="defaultSub" type="hidden"><div id="defaultSubList" class="name-list"></div></div></div></div></div></div></div>
<div id="meta" class="muted" style="margin-top:10px"></div>
<div class="tablebox"><table><thead><tr><th class="check">Pilih</th><th>Jam</th><th>Kelas</th><th>Guru Asal</th><th>Guru Pengganti</th><th>Alasan</th><th>Status</th></tr></thead><tbody id="body"><tr><td colspan="7" class="empty">Pilih guru untuk melihat jam halaqah.</td></tr></tbody></table></div>
<button id="save" class="btn-save" disabled>Simpan Badal Terpilih</button></div>
<script>
const API='https://lmglkxzemtvxcgktiord.supabase.co/functions/v1/tahfizh-badal',KEY='sb_publishable_3HyNVUYXakILMKo2SK-DJw_ka7-Yx93',TOKEN=localStorage.getItem('cqlass_session_token')||'',E=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let boot=null,rows=[];
E('date').value=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta'}).format(new Date());
async function api(b){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY,'x-session-token':TOKEN},body:JSON.stringify(b)}),j=await r.json();if(!r.ok||j.success===false)throw Error(j.error||'Gagal');return j}
function sessionKey(x){return x.teacher_id+'|'+x.class_id+'|'+String(x.start_time).slice(0,5)}
function listPicker(inputId,valueId,listId,items,onPick){const input=E(inputId),hidden=E(valueId),list=E(listId);function draw(){const q=input.value.trim().toLowerCase(),found=items.filter(x=>!q||String(x.name).toLowerCase().includes(q)).slice(0,80);list.innerHTML=found.length?found.map(x=>'<button type="button" class="name-item '+(String(hidden.value)===String(x.id)?'selected':'')+'" data-id="'+esc(x.id)+'">'+esc(x.name)+'</button>').join(''):'<div class="pickempty">Nama guru tidak ditemukan</div>';list.querySelectorAll('.name-item').forEach(el=>el.onclick=()=>{hidden.value=el.dataset.id;draw();onPick&&onPick(el.dataset.id)})}input.oninput=draw;draw()}
function teacherItems(){const map=new Map();(boot?.sessions||[]).forEach(x=>{if(x.teacher_id&&x.teacher_name)map.set(String(x.teacher_id),String(x.teacher_name))});return[...map].map(([id,name])=>({id,name})).sort((a,b)=>a.name.localeCompare(b.name,'id'))}
function fillTeachers(){const old=E('teacher').value,items=teacherItems();if(old&&!items.some(x=>String(x.id)===String(old)))E('teacher').value='';listPicker('teacherSearch','teacher','teacherList',items,()=>render())}
function fillDefault(){const origin=E('teacher').value,old=E('defaultSub').value,items=((boot&&boot.candidates)||[]).filter(x=>String(x.id)!==String(origin)).map(x=>({id:String(x.id),name:String(x.name)})).sort((a,b)=>a.name.localeCompare(b.name,'id'));if(old&&!items.some(x=>String(x.id)===String(old)))E('defaultSub').value='';listPicker('defaultSubSearch','defaultSub','defaultSubList',items,()=>applyDefault())}
function applyDefault(){const v=E('defaultSub').value;if(!v)return;document.querySelectorAll('.slot:checked').forEach(ch=>{const s=E('t'+ch.dataset.i);if(s)s.value=v})}\nfunction render(){const tid=E('teacher').value;fillDefault();if(!tid){rows=[];E('body').innerHTML='<tr><td colspan="7" class="empty">Pilih guru untuk melihat jam halaqah.</td></tr>';E('save').disabled=true;return}
 const subs=new Map((boot.substitutions||[]).map(x=>[x.original_teacher_id+'|'+x.class_id+'|'+String(x.start_time).slice(0,5),x]));rows=(boot.sessions||[]).filter(x=>String(x.teacher_id)===tid);
 E('body').innerHTML=rows.length?rows.map((x,i)=>{const s=subs.get(sessionKey(x));return '<tr><td class="check">'+(s?'✓':'<input class="slot" type="checkbox" data-i="'+i+'">')+'</td><td><b>'+esc(String(x.start_time).slice(0,5))+'–'+esc(String(x.end_time).slice(0,5))+'</b></td><td>'+esc(x.class_name)+'</td><td>'+esc(x.teacher_name)+'</td><td>'+(s?'<b>'+esc(s.substitute_name)+'</b>':'<select class="replacement" id="t'+i+'"><option value="">— Pilih pengganti —</option>'+boot.candidates.filter(c=>String(c.id)!==String(x.teacher_id)).map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join('')+'</select>')+'</td><td>'+(s?esc(s.reason||'—'):'<input class="reason" id="r'+i+'" placeholder="Alasan badal">')+'</td><td>'+(s?'<span class="active">Aktif</span>':'Belum ditetapkan')+'</td></tr>'}).join(''):'<tr><td colspan="7" class="empty">Tidak ada jadwal halaqah guru ini pada tanggal tersebut.</td></tr>';
 E('save').disabled=true;document.querySelectorAll('.slot').forEach(x=>x.onchange=()=>{E('save').disabled=!document.querySelectorAll('.slot:checked').length;if(x.checked){const v=E('defaultSub').value,s=E('t'+x.dataset.i);if(v&&s)s.value=v}});E('meta').textContent=rows.length+' sesi untuk '+(rows[0]?.teacher_name||'guru terpilih')+' · centang jam yang akan dibadal'}
async function load(keepTeacher=true){try{E('meta').textContent='Memuat jadwal...';const old=keepTeacher?E('teacher').value:'';boot=await api({action:'bootstrap',work_date:E('date').value});fillTeachers();if(old)E('teacher').value=old;render()}catch(e){E('meta').textContent=e.message}}
async function save(){const chosen=[...document.querySelectorAll('.slot:checked')].map(x=>Number(x.dataset.i));if(!chosen.length)return;for(const i of chosen){const x=rows[i],tid=E('t'+i).value,reason=E('r'+i).value.trim();if(!tid)return alert('Pilih guru pengganti untuk jam '+String(x.start_time).slice(0,5));if(!reason)return alert('Isi alasan badal untuk jam '+String(x.start_time).slice(0,5))}
 const b=E('save');try{b.disabled=true;b.textContent='Menyimpan...';for(const i of chosen){const x=rows[i];await api({action:'assign',work_date:E('date').value,class_id:x.class_id,original_teacher_id:x.teacher_id,start_time:String(x.start_time).slice(0,5),end_time:String(x.end_time).slice(0,5),substitute_source:'teacher',substitute_teacher_id:E('t'+i).value,reason:E('r'+i).value.trim()})}await load(true);b.textContent='Tersimpan ✓';setTimeout(()=>b.textContent='Simpan Badal Terpilih',1400)}catch(e){alert(e.message);b.disabled=false;b.textContent='Simpan Badal Terpilih'}}
E('load').onclick=()=>load(true);E('date').onchange=()=>load(false);E('save').onclick=save;load(false);
</script></body></html>

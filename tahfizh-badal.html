<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Badal Tahfizh</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f8fa;color:#17324d}.top{background:#173f63;color:#fff;padding:18px}.top h2{margin:7px 0 3px}.back{color:#fff}.wrap{max-width:1180px;margin:auto;padding:14px}.toolbar{background:#fff;border:1px solid #e0e9ee;border-radius:14px;padding:14px;box-shadow:0 3px 12px rgba(23,63,99,.05)}.bar{display:grid;grid-template-columns:145px minmax(190px,1fr) 120px minmax(190px,1fr);gap:10px;align-items:end}.field{min-width:0}.field label{display:block;margin:0 0 5px;font-size:11px;font-weight:800;color:#536d7b}input,select,button{height:38px;border:1px solid #ccdbe3;border-radius:9px;background:#fff;padding:0 10px;font:inherit;font-size:12px;color:#17324d}select{width:100%}button{background:#173f63;color:#fff;font-weight:800;cursor:pointer}.load{width:100%}.muted{margin:9px 2px 0;color:#718493;font-size:12px}.tablebox{margin-top:12px;overflow-x:auto;border:1px solid #e0e9ee;border-radius:14px;background:#fff}.tablebox table{width:100%;min-width:850px;border-collapse:collapse}.tablebox th,.tablebox td{padding:10px;border-bottom:1px solid #e6eef2;text-align:left;font-size:12px}.tablebox th{background:#eef5f7;font-size:11px}.check{text-align:center!important;width:48px}.check input{width:17px;height:17px;accent-color:#173f63}.replacement{min-width:180px}.reason{min-width:190px;width:100%}.active{font-weight:800;color:#087b75}.empty{text-align:center!important;color:#718493;padding:24px!important}.save{margin-top:12px;min-width:190px}.save:disabled{opacity:.5;cursor:not-allowed}
@media(max-width:760px){.wrap{padding:10px}.toolbar{padding:11px}.bar{grid-template-columns:110px minmax(0,1fr)}.bar .load{grid-column:1/2}.bar .default-field{grid-column:2/3}.tablebox{border-radius:11px}.save{width:100%}}
</style></head>
<body><div class="top"><a class="back" href="./">← CQlass</a><h2>Badal Tahfizh</h2><div>Pilih guru, jam badal, pengganti, dan alasan.</div></div>
<div class="wrap">
  <div class="toolbar"><div class="bar">
    <div class="field"><label>Tanggal</label><input id="date" type="date"></div>
    <div class="field"><label>Guru yang dibadal</label><select id="teacher"><option value="">— Pilih guru —</option></select></div>
    <button id="load" class="load">Muat Jam</button>
    <div class="field default-field"><label>Pengganti Default</label><select id="defaultSub"><option value="">— Pilih pengganti —</option></select></div>
  </div></div>
  <div id="meta" class="muted"></div>
  <div class="tablebox"><table><thead><tr><th class="check">Pilih</th><th>Jam</th><th>Kelas</th><th>Guru Asal</th><th>Guru Pengganti</th><th>Alasan</th><th>Status</th></tr></thead><tbody id="body"><tr><td colspan="7" class="empty">Pilih guru untuk melihat jam halaqah.</td></tr></tbody></table></div>
  <button id="save" class="save" disabled>Simpan Badal Terpilih</button>
</div>
<script>
const API='https://lmglkxzemtvxcgktiord.supabase.co/functions/v1/tahfizh-badal',KEY='sb_publishable_3HyNVUYXakILMKo2SK-DJw_ka7-Yx93',TOKEN=localStorage.getItem('cqlass_session_token')||'',E=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let boot=null,rows=[];
E('date').value=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta'}).format(new Date());
async function api(b){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY,'x-session-token':TOKEN},body:JSON.stringify(b)}),j=await r.json();if(!r.ok||j.success===false)throw Error(j.error||'Gagal');return j}
function key(x){return x.teacher_id+'|'+x.class_id+'|'+String(x.start_time).slice(0,5)}
function teachers(){const m=new Map();(boot?.sessions||[]).forEach(x=>{if(x.teacher_id&&x.teacher_name)m.set(String(x.teacher_id),String(x.teacher_name))});return[...m].map(([id,name])=>({id,name})).sort((a,b)=>a.name.localeCompare(b.name,'id'))}
function fillTeachers(){const old=E('teacher').value,items=teachers();E('teacher').innerHTML='<option value="">— Pilih guru —</option>'+items.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('');if(items.some(x=>x.id===old))E('teacher').value=old}
function candidates(){const origin=E('teacher').value;return(boot?.candidates||[]).filter(x=>String(x.id)!==String(origin)).map(x=>({id:String(x.id),name:String(x.name)})).sort((a,b)=>a.name.localeCompare(b.name,'id'))}
function fillDefault(){const old=E('defaultSub').value,items=candidates();E('defaultSub').innerHTML='<option value="">— Pilih pengganti —</option>'+items.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('');if(items.some(x=>x.id===old))E('defaultSub').value=old}
function applyDefault(){const v=E('defaultSub').value;if(!v)return;document.querySelectorAll('.slot:checked').forEach(ch=>{const s=E('t'+ch.dataset.i);if(s)s.value=v})}
function render(){const tid=E('teacher').value;fillDefault();if(!tid){rows=[];E('body').innerHTML='<tr><td colspan="7" class="empty">Pilih guru untuk melihat jam halaqah.</td></tr>';E('save').disabled=true;E('meta').textContent='';return}const subs=new Map((boot.substitutions||[]).map(x=>[x.original_teacher_id+'|'+x.class_id+'|'+String(x.start_time).slice(0,5),x]));rows=(boot.sessions||[]).filter(x=>String(x.teacher_id)===String(tid));E('body').innerHTML=rows.length?rows.map((x,i)=>{const s=subs.get(key(x));return '<tr><td class="check">'+(s?'✓':'<input class="slot" type="checkbox" data-i="'+i+'">')+'</td><td><b>'+esc(String(x.start_time).slice(0,5))+'–'+esc(String(x.end_time).slice(0,5))+'</b></td><td>'+esc(x.class_name)+'</td><td>'+esc(x.teacher_name)+'</td><td>'+(s?'<b>'+esc(s.substitute_name)+'</b>':'<select class="replacement" id="t'+i+'"><option value="">— Pilih —</option>'+candidates().map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join('')+'</select>')+'</td><td>'+(s?esc(s.reason||'—'):'<input class="reason" id="r'+i+'" placeholder="Alasan badal">')+'</td><td>'+(s?'<span class="active">Aktif</span>':'Belum ditetapkan')+'</td></tr>'}).join(''):'<tr><td colspan="7" class="empty">Tidak ada jadwal halaqah guru ini pada tanggal tersebut.</td></tr>';E('save').disabled=true;document.querySelectorAll('.slot').forEach(ch=>ch.onchange=()=>{E('save').disabled=!document.querySelectorAll('.slot:checked').length;if(ch.checked){const v=E('defaultSub').value,s=E('t'+ch.dataset.i);if(v&&s)s.value=v}});E('meta').textContent=rows.length+' sesi · '+(rows[0]?.teacher_name||'guru terpilih')}
async function load(keep=true){try{E('meta').textContent='Memuat jadwal...';const old=keep?E('teacher').value:'';boot=await api({action:'bootstrap',work_date:E('date').value});fillTeachers();if(old&&teachers().some(x=>x.id===old))E('teacher').value=old;render()}catch(e){E('meta').textContent=e.message}}
async function save(){const chosen=[...document.querySelectorAll('.slot:checked')].map(x=>Number(x.dataset.i));if(!chosen.length)return;for(const i of chosen){const x=rows[i],tid=E('t'+i).value,reason=E('r'+i).value.trim();if(!tid)return alert('Pilih guru pengganti untuk jam '+String(x.start_time).slice(0,5));if(!reason)return alert('Isi alasan badal untuk jam '+String(x.start_time).slice(0,5))}const b=E('save');try{b.disabled=true;b.textContent='Menyimpan...';for(const i of chosen){const x=rows[i];await api({action:'assign',work_date:E('date').value,class_id:x.class_id,original_teacher_id:x.teacher_id,start_time:String(x.start_time).slice(0,5),end_time:String(x.end_time).slice(0,5),substitute_source:'teacher',substitute_teacher_id:E('t'+i).value,reason:E('r'+i).value.trim()})}await load(true);b.textContent='Tersimpan ✓';setTimeout(()=>b.textContent='Simpan Badal Terpilih',1200)}catch(e){alert(e.message);b.disabled=false;b.textContent='Simpan Badal Terpilih'}}
E('load').onclick=()=>load(true);E('teacher').onchange=render;E('defaultSub').onchange=applyDefault;E('date').onchange=()=>load(false);E('save').onclick=save;load(false);
</script></body></html>

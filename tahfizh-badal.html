<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Badal Tahfizh</title><style>body{font-family:Inter,Arial;background:#f4f8fa;color:#17324d;margin:0}.top{background:#173f63;color:#fff;padding:22px}.wrap{max-width:1150px;margin:auto;padding:18px}.bar{display:flex;gap:10px;flex-wrap:wrap}input,select,button{padding:9px;border:1px solid #ccdbe3;border-radius:9px}button{background:#173f63;color:#fff;font-weight:700}table{width:100%;border-collapse:collapse;background:#fff;margin-top:14px}th,td{padding:9px;border-bottom:1px solid #e6eef2;text-align:left;font-size:12px}th{background:#eef5f7}.back{color:#fff}.muted{color:#718493;font-size:12px}</style></head><body><div class="top"><a class="back" href="./">← CQlass</a><h2>Badal Tahfizh</h2><div>Penugasan dan rekap pengganti halaqah Tahfizh.</div></div><div class="wrap"><div class="bar"><input id="date" type="date"><button id="load">Muat Jadwal</button></div><div id="meta" class="muted" style="margin-top:10px"></div><table><thead><tr><th>Jam</th><th>Kelas</th><th>Guru Asal</th><th>Pengganti</th><th>Alasan</th><th>Aksi</th></tr></thead><tbody id="body"></tbody></table></div><script>
const API='https://lmglkxzemtvxcgktiord.supabase.co/functions/v1/tahfizh-badal',KEY='sb_publishable_3HyNVUYXakILMKo2SK-DJw_ka7-Yx93',TOKEN=localStorage.getItem('cqlass_session_token')||'',E=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let boot;
E('date').value=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta'}).format(new Date());
async function api(b){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY,'x-session-token':TOKEN},body:JSON.stringify(b)}),j=await r.json();if(!r.ok||j.success===false)throw Error(j.error||'Gagal');return j}
async function load(){try{boot=await api({action:'bootstrap',work_date:E('date').value});const sub=new Map((boot.substitutions||[]).map(x=>[x.original_teacher_id+'|'+x.class_id+'|'+String(x.start_time).slice(0,5),x]));E('body').innerHTML=(boot.sessions||[]).map((x,i)=>{const k=x.teacher_id+'|'+x.class_id+'|'+String(x.start_time).slice(0,5),s=sub.get(k);return '<tr><td>'+esc(String(x.start_time).slice(0,5))+'–'+esc(String(x.end_time).slice(0,5))+'</td><td>'+esc(x.class_name)+'</td><td>'+esc(x.teacher_name)+'</td><td>'+(s?'<b>'+esc(s.substitute_name)+'</b>':'<select id="t'+i+'"><option value="">— pilih —</option>'+boot.candidates.filter(c=>c.id!==x.teacher_id).map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select>')+'</td><td>'+(s?esc(s.reason||'—'):'<input id="r'+i+'" placeholder="Alasan">')+'</td><td>'+(s?'Aktif':'<button onclick="assign('+i+')">Tetapkan</button>')+'</td></tr>'}).join('');window.rows=boot.sessions||[];E('meta').textContent=(boot.sessions||[]).length+' sesi Tahfizh · '+(boot.substitutions||[]).length+' badal aktif'}catch(e){E('meta').textContent=e.message}}
async function assign(i){const x=window.rows[i],tid=E('t'+i).value;if(!tid)return alert('Pilih guru pengganti');try{await api({action:'assign',work_date:E('date').value,class_id:x.class_id,original_teacher_id:x.teacher_id,start_time:String(x.start_time).slice(0,5),end_time:String(x.end_time).slice(0,5),substitute_source:'teacher',substitute_teacher_id:tid,reason:E('r'+i).value});load()}catch(e){alert(e.message)}}E('load').onclick=load;load();</script></body></html>

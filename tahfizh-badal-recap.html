<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rekapan Badal Tahfizh</title>
<style>
:root{--primary:#0b7b75;--text:#17324d;--muted:#6c7f86;--border:#dce9e7;--bg:#f5faf9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.top{padding:20px 24px;background:#fff;border-bottom:1px solid var(--border)}.top h2{margin:0 0 4px;font-size:20px}.top p{margin:0;color:var(--muted);font-size:12px}.wrap{padding:18px 24px}.filters{display:flex;gap:10px;align-items:end;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:11px;font-weight:800;color:#526b72}.field input,button{height:38px;border:1px solid #cfdfdd;border-radius:10px;padding:0 11px;font:inherit;font-size:12px}button{background:var(--primary);color:#fff;font-weight:800;cursor:pointer}.summary{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:10px;margin:14px 0}.stat{background:#fff;border:1px solid var(--border);border-radius:13px;padding:13px}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}.card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:11px 12px;border-bottom:1px solid #e8efee;text-align:left;font-size:11.5px}th{background:#f1f7f6;font-size:11px}.status{font-weight:800}.active{color:#087b75}.cancelled{color:#b45353}.empty{padding:28px;text-align:center;color:var(--muted)}@media(max-width:800px){.summary{grid-template-columns:1fr 1fr}.wrap,.top{padding-left:14px;padding-right:14px}}
</style></head><body>
<div class="top"><h2>Rekapan Badal Tahfizh</h2><p>Riwayat penugasan guru pengganti halaqah Tahfizh.</p></div>
<div class="wrap"><div class="filters"><div class="field"><label>Dari tanggal</label><input id="from" type="date"></div><div class="field"><label>Sampai tanggal</label><input id="to" type="date"></div><button id="load">Tampilkan Rekap</button></div>
<div class="summary"><div class="stat"><b id="total">0</b><span>Total penugasan</span></div><div class="stat"><b id="aktif">0</b><span>Badal aktif</span></div><div class="stat"><b id="batal">0</b><span>Dibatalkan</span></div><div class="stat"><b id="guru">0</b><span>Guru pengganti</span></div></div>
<div class="card"><div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Jam</th><th>Kelas</th><th>Guru Asal</th><th>Guru Pengganti</th><th>Jenis</th><th>Alasan</th><th>Status</th></tr></thead><tbody id="body"></tbody></table></div><div id="empty" class="empty" style="display:none">Belum ada data badal pada periode ini.</div></div></div>
<script>
const API='https://lmglkxzemtvxcgktiord.supabase.co/functions/v1/tahfizh-badal',KEY='sb_publishable_3HyNVUYXakILMKo2SK-DJw_ka7-Yx93',TOKEN=localStorage.getItem('cqlass_session_token')||'',E=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function jakarta(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta'}).format(new Date())}function minus30(s){const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-30);return d.toISOString().slice(0,10)}
E('to').value=jakarta();E('from').value=minus30(E('to').value);
async function api(b){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY,'x-session-token':TOKEN},body:JSON.stringify(b)}),j=await r.json();if(!r.ok||j.success===false)throw Error(j.error||'Gagal memuat rekap');return j}
async function load(){const btn=E('load');try{btn.disabled=true;btn.textContent='Memuat...';const j=await api({action:'recap',from:E('from').value,to:E('to').value}),a=j.items||[];E('total').textContent=a.length;E('aktif').textContent=a.filter(x=>x.status==='active').length;E('batal').textContent=a.filter(x=>x.status==='cancelled').length;E('guru').textContent=new Set(a.map(x=>x.substitute_name).filter(Boolean)).size;E('body').innerHTML=a.map(x=>'<tr><td>'+esc(x.work_date)+'</td><td>'+esc(String(x.start_time||'').slice(0,5))+'–'+esc(String(x.end_time||'').slice(0,5))+'</td><td>'+esc(x.class_name)+'</td><td>'+esc(x.original_teacher_name)+'</td><td><b>'+esc(x.substitute_name||'—')+'</b></td><td>'+esc(x.substitute_type||'—')+'</td><td>'+esc(x.reason||'—')+'</td><td class="status '+esc(x.status)+'">'+esc(x.status==='active'?'Aktif':'Dibatalkan')+'</td></tr>').join('');E('empty').style.display=a.length?'none':'block'}catch(e){E('body').innerHTML='';E('empty').style.display='block';E('empty').textContent=e.message}finally{btn.disabled=false;btn.textContent='Tampilkan Rekap'}}
E('load').onclick=load;load();
</script></body></html>
